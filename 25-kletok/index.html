<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>25 клеток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Neucha&display=swap" rel="stylesheet">
<style>
:root{
  /* Вечер за настольной игрой: тёплая бумага с зерном, свет лампы сверху, карамельный акцент, клетки как бумажные карточки на крафтовом подносе. Поле занимает максимум места, панель узкая справа. */
  --bg:#f2e9dc;--glow:rgba(255,196,120,.32);--grain:.55;--surface:#fffaf2;--surface2:#f5ecdf;--tray:#e4d4bd;
  --text:#3a2e27;--muted:#87766a;--line:#e8dbc9;
  --accent:#a65f28;--accent-ink:#fffaf2;--accent-soft:#f7e7d1;--accent-line:#e6c69e;
  --ok:#5b8752;--no:#bb5b4c;--ok-soft:#e6efdc;--no-soft:#f7e2da;
  --board:#fffcf6;--num:#b8a693;--mark:#fbe5b0;--hover:#fbf0e0;--tile-shadow:rgba(96,62,28,.20);--art-ink:#4f2f20;--hi:rgba(255,255,255,.55);
  --shadow:0 1px 2px rgba(80,50,25,.06),0 14px 34px -18px rgba(80,50,25,.32);
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Comfortaa","Manrope",system-ui,sans-serif;
  --f-hand:"Neucha","Comic Sans MS","Marker Felt",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140f0c;--glow:rgba(255,120,40,.30);--grain:.32;--surface:#211913;--surface2:#2a2019;--tray:#110c09;
    --text:#f4e7d6;--muted:#bba189;--line:#3a2b21;
    --accent:#f29a4a;--accent-ink:#22140a;--accent-soft:#3c2717;--accent-line:#6b4324;
    --ok:#9fca8c;--no:#ef8d79;--ok-soft:#24301d;--no-soft:#3e231d;
    --board:#2a1f18;--num:#7c6553;--mark:#5c3a16;--hover:#34261c;--tile-shadow:rgba(0,0,0,.55);--art-ink:#f1dcc3;--hi:rgba(255,200,140,.04);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.8);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140f0c;--glow:rgba(255,120,40,.30);--grain:.32;--surface:#211913;--surface2:#2a2019;--tray:#110c09;
  --text:#f4e7d6;--muted:#bba189;--line:#3a2b21;
  --accent:#f29a4a;--accent-ink:#22140a;--accent-soft:#3c2717;--accent-line:#6b4324;
  --ok:#9fca8c;--no:#ef8d79;--ok-soft:#24301d;--no-soft:#3e231d;
  --board:#2a1f18;--num:#7c6553;--mark:#5c3a16;--hover:#34261c;--tile-shadow:rgba(0,0,0,.55);--art-ink:#f1dcc3;--hi:rgba(255,200,140,.04);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.8);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:radial-gradient(ellipse 80% 55% at 50% -12%,var(--glow),transparent 70%);background-attachment:fixed;--fire:0;color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.hand{font-family:var(--f-hand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}

.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:color-mix(in srgb,var(--surface) 78%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand i{display:inline-grid;grid-template-columns:repeat(5,5px);gap:2px;padding:4px;border-radius:7px;background:var(--surface2)}
.brand i b{width:5px;height:4px;border-radius:1.5px;background:var(--tray);display:block}
.brand i b:nth-child(7),.brand i b:nth-child(13),.brand i b:nth-child(19){background:var(--accent)}
.status{flex:1;min-width:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--text);font-weight:700}
.tools{display:flex;gap:6px;align-items:center}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);transition:color .15s,border-color .15s}
.icon:hover{color:var(--text);border-color:var(--accent-line)}
.icon svg{width:18px;height:18px}
.icon[aria-pressed="false"]{opacity:.55}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.ghost:hover{color:var(--text);border-color:var(--accent-line)}
.ghost.warn{color:var(--no);border-color:var(--no)}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;margin-right:4px}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.net.off i{background:var(--no);box-shadow:0 0 0 3px var(--no-soft)}

body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--grain);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .2 0 0 0 .09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");z-index:0}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px;overflow:auto;position:relative;z-index:1}
.page{width:100%;max-width:1160px;margin:0 auto}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:filter .15s,transform .08s,background .15s;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 6px 16px -10px var(--accent)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.big{padding:16px 20px;font-size:16px;width:100%}
.btn.soft{background:var(--surface2);color:var(--text);box-shadow:none}
.btn.soft:hover{filter:none;background:var(--line)}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.line:hover{border-color:var(--accent-line);background:var(--accent-soft);filter:none}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 6px 16px -10px var(--ok)}
.btn.no{background:var(--no);color:#fff;box-shadow:0 6px 16px -10px var(--no)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none}
kbd{font-family:var(--f-body);font-size:11px;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.6;font-weight:600}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.codein{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.3em;text-align:center}
textarea.input{min-height:110px;resize:vertical;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:4px;background:var(--surface2);border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:8px}
.field>label{font-weight:700;font-size:14px}
.note{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--no)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:700;font-size:14px}
details[open] summary{margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.pad{padding:26px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;margin:10px 0 28px}
.eyebrow{font-family:var(--f-hand);font-size:16px!important;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:99px;margin-bottom:16px}
.title{font-family:var(--f-display);font-size:clamp(46px,6.6vw,82px);font-weight:700;line-height:.95;letter-spacing:-.04em}
.title span{display:block;font-family:var(--f-hand);font-size:.5em;letter-spacing:0;color:var(--accent);font-weight:400;margin-top:8px;transform:rotate(-1.5deg);transform-origin:left}
.lead{font-size:17px;max-width:44ch;margin-top:18px;color:var(--muted)}
.lead b{color:var(--text)}
.demo{position:relative}
.demo canvas{display:block;width:100%;aspect-ratio:5/4;border-radius:24px;box-shadow:var(--shadow),0 0 0 1px var(--line);transform:rotate(-1.2deg)}
.demo .say-bubble{z-index:2;transform:rotate(1.5deg);position:absolute;left:-14px;bottom:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:14px;max-width:70%}
.demo .say-bubble b{font-family:var(--f-hand);font-size:19px;font-weight:400;color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
.steps li{display:flex;flex-direction:column;gap:10px;counter-increment:s;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-hand);font-weight:400;font-size:20px;display:grid;place-items:center}
.modes{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}
.mode{display:flex;flex-direction:column;gap:14px}
.mode .tag{font-family:var(--f-hand);display:inline-flex;align-self:flex-start;font-size:15px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
.lobbies{display:flex;flex-direction:column;gap:8px}
.lob{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.lob b{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.howonline ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;font-size:14px}

.av{--c:#888;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:13px;flex:none;box-shadow:0 0 0 2px var(--surface)}
.av.lg{width:48px;height:48px;font-size:19px}
.av.sm{width:22px;height:22px;font-size:10px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px}
.prow .input{padding:9px 12px}
.prow .x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:9px;font-size:18px}
.prow .x:hover{background:var(--surface2);color:var(--no)}
.you{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 8px}

.lobbygrid{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}
.digits{display:flex;gap:8px}
#wrap.peekblur canvas{filter:blur(16px);transition:filter .2s}
#wrap.peekblur::after{content:"Вы ушли из игры. Вернитесь, чтобы рисовать";position:absolute;inset:auto 0 45% 0;text-align:center;font-weight:800;z-index:5;color:var(--text)}
.peek{font-size:13px;margin-left:2px;cursor:help}
.teams{display:grid;gap:6px;margin-bottom:10px}
.team{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-size:14px}
.team span{color:var(--muted);font-size:12px;white-space:nowrap}.team b{flex:1;min-width:0;overflow-wrap:anywhere}.team em{font-style:normal;font-weight:800;font-size:18px}
.team.lead{border-color:var(--accent);background:var(--accent-soft)}
.series{display:flex;flex-direction:column;gap:4px;align-items:center;margin:10px 0}
.sline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:17px}.sline i{color:var(--muted);font-style:normal}.sline b{font-size:20px}.sline .lead b{color:var(--accent)}
.titles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
.ttl{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);animation:ttlIn .5s both}
.ttl:nth-child(2){animation-delay:.15s}.ttl:nth-child(3){animation-delay:.3s}.ttl:nth-child(4){animation-delay:.45s}
.ttl .te{font-size:30px}.ttl div{display:flex;flex-direction:column;gap:2px}.ttl b{display:flex;align-items:center;gap:6px}.ttl small{color:var(--muted);font-size:12px}
@keyframes ttlIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.stathome{margin-top:18px}.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);text-align:center}.stc b{font-size:26px}.stc span{color:var(--muted);font-size:13px}
.mixer{position:fixed;top:64px;right:16px;z-index:40;width:min(320px,calc(100vw - 32px));padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.mixr{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.mixr input[type=range]{width:100%;accent-color:var(--accent)}.mixr em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mixr.chk{display:flex;gap:8px}.mixr.chk input{width:18px;height:18px;accent-color:var(--accent)}
.grace{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:12px}
.grace b{font-size:18px}.grace .gnum{font:800 46px/1.1 Comfortaa,Manrope,system-ui,sans-serif;color:var(--accent)}
.mn{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 6px;vertical-align:2px}
.rtag.out{background:var(--noSoft,#5a2a24);color:var(--no,#e5483f)}
.lvl{display:flex;align-items:center;gap:12px;margin:10px 0 4px}.lvl .grow{display:flex;flex-direction:column;gap:4px}
.lvlbadge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:800 22px Comfortaa,Manrope,sans-serif;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.streak{display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:1}.streak b{font-size:20px}.streak span{font-size:11px;color:var(--muted)}
.fame{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);margin:8px 0}
.fr{display:grid;grid-template-columns:24px 1fr auto;gap:2px 8px;align-items:center}.fr em{font-style:normal;color:var(--muted);font-size:12px;grid-column:2}.fr b{grid-column:2}.fr small{grid-column:3;grid-row:1/3;font-weight:700;color:var(--accent)}.fr span{grid-row:1/3;font-size:20px}
.boardwrap.spywrap{display:block;overflow:auto;aspect-ratio:auto;align-self:stretch;max-height:calc(100dvh - 120px)}
.spygrid{display:grid;width:100%;box-sizing:border-box;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:4px 4px 14px}
.spc{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.spc canvas{width:100%;aspect-ratio:1.25;border-radius:12px}
.spc.pick{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-line)}
.spc.spy{border-color:var(--no,#e5483f);box-shadow:0 0 0 2px var(--no,#e5483f)}
.spn{display:flex;align-items:center;gap:6px}.spn em{margin-left:auto;font-style:normal;color:var(--muted);font-size:13px}
.spw{font-weight:800;text-align:center;font-size:17px}
.crword.fake{color:var(--no,#e5483f);font-size:20px;letter-spacing:0}
.pdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.sitebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 -6px}
.sitelink{font-weight:700;font-size:14px;text-decoration:none;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.sitelink:hover{color:var(--text);border-color:var(--accent-line)}
.onl{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.onl i{width:8px;height:8px;border-radius:50%;background:#4cc36a;box-shadow:0 0 0 3px rgba(76,195,106,.2);animation:onl 2s infinite}
@keyframes onl{50%{box-shadow:0 0 0 6px rgba(76,195,106,0)}}
.flagnote{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:10px 12px}.flagnote p{margin:0;font-size:14px}.flagnote p+p{margin-top:6px}
.comic{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-height:68vh;overflow:auto;padding:4px}
.comic figure{margin:0;position:relative;display:flex;flex-direction:column;gap:6px}
.comic canvas{width:100%;aspect-ratio:1.25;border-radius:12px;background:var(--board);border:3px solid var(--text)}
.comic figcaption{font-size:13px;font-weight:700;text-align:center}.comic figcaption small{color:var(--muted);margin-right:4px}
.crword{font:800 26px/1.3 Comfortaa,Manrope,system-ui,sans-serif;letter-spacing:.06em;padding:10px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);text-align:center;word-break:break-word;margin:6px 0 10px}
.crword.open{color:var(--accent);letter-spacing:.01em}
.crfeed{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.crf{display:flex;align-items:center;gap:8px;font-size:14px}.crf span{color:var(--muted);overflow-wrap:anywhere}
.crf.ok span{color:var(--ok);font-weight:800}.crf.near span{color:var(--accent)}
.crok{font-weight:800;color:var(--ok)}
.invite{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}
.btn.sm{padding:8px 14px;font-size:14px;min-height:0}
.small{font-size:13px;line-height:1.4}
.invite .qr{width:132px;flex:none;border-radius:10px;overflow:hidden;background:#fff8ee}
.invite .qr svg{display:block;width:100%;height:auto}

/* Кто из игроков может сделать действие со своего устройства (онлайн) */
function allowed(G,pid,type,arg){
  const i=G.players.findIndex(p=>p.pid===pid);if(i<0)return false;
  const ask=G.phase==="ask",P=G.pend;
  if(isDuel(G)){
    if(type==="pick")return G.selfPlay&&ask&&i===gPicker(G)&&!P;
    if(type==="dans")return G.selfPlay&&ask&&!!P&&!P.rev;
    if(type==="dacc")return G.selfPlay&&ask&&!!P&&P.rev&&+arg!==i;
    if(type==="dnext")return G.selfPlay&&ask&&!!P&&P.rev;
    if(type==="reveal")return !G.selfPlay;
    if(["startDict","pause","next","finishDict"].includes(type))return G.selfPlay;
    return false;}

  if(type==="joker")return ask&&!!G.jokers&&i===gAnswerer(G);
  if(type==="gavote")return G.phase==="gauthor";

  if(type==="foul"){const ft=foulTarget(G);return ft>=0&&i!==ft&&(G.phase==="draw"||ask);}
  if(G.selfPlay){
    if(["startDict","pause","finishDict","next"].includes(type))return true;
    if(type==="cans")return ask&&!!P&&!P.rev&&i===d;
    if(type==="ok"||type==="no")return ask&&!!P&&P.rev&&i===a;
    return false;}
  if(!G.auto)return false;
  if(type==="startDict"||type==="pause")return i===d;
  if(type==="reveal"||type==="ok"||type==="no")return i===a||i===d;
  return false;
}

function startDemo(){
  cancelAnimationFrame(DEMO.raf);DEMO.plan=demoPlan();DEMO.idx=0;DEMO.stroke=0;DEMO.pt=0;DEMO.hold=0;DEMO.strokes=[];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){DEMO.plan.forEach(d=>d.strokes.forEach(p=>DEMO.strokes.push({k:d.k,c:d.c,s:1,p})));DEMO.idx=DEMO.plan.length;drawDemo();return;}
  let last=performance.now();
  const step=t=>{
    const cv=$("#demo");if(!cv)return;const dt=Math.min(60,t-last);last=t;
    if(DEMO.idx<DEMO.plan.length){
      if(DEMO.hold>0)DEMO.hold-=dt;
      else{
        const d=DEMO.plan[DEMO.idx];
        if(DEMO.stroke===0&&DEMO.pt===0){const b=$("#bubble");if(b)b.innerHTML=`Ведущий: <b>«номер ${d.k+1}… ${d.w}»</b>`;}
        const s=d.strokes[DEMO.stroke];
        if(DEMO.pt===0)DEMO.strokes.push({k:d.k,c:d.c,s:1,p:[]});
        const cur=DEMO.strokes[DEMO.strokes.length-1],add=Math.max(1,Math.round(dt/16*1.6));
        for(let i=0;i<add&&DEMO.pt<s.length;i++)cur.p.push(s[DEMO.pt++]);
        if(DEMO.pt>=s.length){DEMO.pt=0;DEMO.stroke++;if(DEMO.stroke>=d.strokes.length){DEMO.stroke=0;DEMO.idx++;DEMO.hold=450;}}
      }
    }else{DEMO.hold+=dt;if(DEMO.hold>3400){DEMO.idx=0;DEMO.hold=0;DEMO.strokes=[];DEMO.plan=demoPlan();}}
    drawDemo();DEMO.raf=requestAnimationFrame(step);

}

  const cv=$("#demo");if(!cv)return;const dpr=window.devicePixelRatio||1,w=Math.round(cv.clientWidth*dpr),h=Math.round(cv.clientHeight*dpr);

  const d=DEMO.plan&&DEMO.plan[Math.min(DEMO.idx,DEMO.plan.length-1)],done=DEMO.plan&&DEMO.idx>=DEMO.plan.length;

      if(r){ROOM=r;NET.kind="room";NET.state="ok";

function hostProcess(){
  const G=HOST.G;if(!G||!G.players)return;let changed=false;
  for(const p of peersIn(HOST.code)){
    const pr=p.presence,a=pr.act;if(!a||!pr.pid||pr.pid===PID)continue;
    if(NET.seen[pr.pid]===a.n)continue;if(G.paused&&a.type!=="pause")continue;NET.seen[pr.pid]=a.n;
    if(a.r!==G.round)continue;
    if(isPhone(G)){const i=G.players.findIndex(x=>x.pid===pr.pid);if(i>=0&&(a.type==="pdone"||a.type==="punready")){applyPhone(G,a.type,a.arg,i);changed=true;}continue;}
    if(isSpy(G)){const i=G.players.findIndex(x=>x.pid===pr.pid);if(i>=0&&["sdone","fline","svote","sguess","snext","fskip"].includes(a.type)){applySpy(G,a.type,a.arg,i);changed=true;}continue;}
    if(isCroc(G)){const i=G.players.findIndex(x=>x.pid===pr.pid);if(i>=0&&["cgo","cswap","cguess","cgive","cnext"].includes(a.type)){applyCroc(G,a.type,a.arg,i);changed=true;}continue;}
    if(["pick","reveal","ok","no","dans","dacc","dnext","joker","guessCell","cans"].includes(a.type)&&(G.phase!=="ask"||a.t!==G.turn))continue;
    if(!allowed(G,pr.pid,a.type,a.arg))continue;
    const idx=G.players.findIndex(x=>x.pid===pr.pid);
    if(a.type==="pick"){const c=+a.arg;if(!(c>=0&&c<(G.n||25))||G.asked[c]||(G.pend&&G.pend.rev)||(G.pend&&G.pend.cell===c))continue;applyAct(G,"pick",c);}
    else if(a.type==="dans")applyAct(G,"dans",{i:idx,t:String(a.arg||"")});
    else if(a.type==="cans")applyAct(G,"cans",String(a.arg||""));
    else if(a.type==="gavote")applyAct(G,"gavote",{i:idx,v:+a.arg});
    else if(a.type==="dacc")applyAct(G,"dmark",{i:+a.arg,ok:true});
    else if(a.type==="dnext")applyAct(G,"dnext");
    else if(a.type==="joker")applyAct(G,"joker",String(a.arg));
    else if(a.type==="guessCell")applyAct(G,"guessCell",+a.arg);
    else if(a.type==="foul")applyAct(G,"foul",{by:idx,to:foulTarget(G)});
    else if(a.type==="next"){if(G.phase!=="end")continue;applyAct(G,"next","draw");D.left=D.pace*1000;}
    else if(a.type==="finishDict")applyAct(G,"finishDict");
    else if(a.type==="ok"||a.type==="no"||a.type==="reveal"){if(!G.pend)continue;if(a.type!=="reveal"&&!G.pend.rev)continue;applyAct(G,a.type,G.players.findIndex(x=>x.pid===pr.pid));}
    else if(a.type==="startDict"){if(G.phase!=="draw"||G.w>=0)continue;applyAct(G,"startDict");D.left=D.pace*1000;}
    else if(a.type==="pause"){if(G.phase!=="draw")continue;applyAct(G,"pause");}
    changed=true;
  }
  if(changed){publishHost();onState();}
}

function doAct(type,arg){
  if(APP.view==="local"&&LG){
    const prevW=LG.w,prevPh=LG.phase,prevB=LG.bonusN||0,snap=JSON.parse(JSON.stringify(LG));applyAct(LG,type,arg);try{achTrack(LG,snap,true);}catch(e){}
    if(LG.phase==="end"&&prevPh!=="end")snapRound(LG,LSTROKES);
    if((LG.bonusN||0)>prevB)setTimeout(()=>toast("Серия из 3 подряд! +1 бонус: "+LG.players[gDrawer(LG)].name),300);
    if(type==="timeout"){sfx("no");toast("Время вышло! Очко получает спросивший");}
    if(type==="guessCell"&&LG.pend&&LG.pend.second===2&&LG.pend.miss&&LG.pend.miss.length===1&&!LG.pend.rev)toast("Мимо! Вторая попытка");
    if(type==="guessCell"&&LG.lastG&&!LG.pend){sfx(LG.lastG.ok?"ok":"no");toast(LG.lastG.ok?"Верно! Клетка найдена":"Мимо. Очко спросившему");}
    if(type==="foulYes")toast("Штраф −1: "+LG.players[arg].name);
    if(type==="next"){LSTROKES=[];APP.listOpen=false;sfx(LG.phase==="final"?"win":"start");if(LG.phase==="final"&&!LG.seriesDone){APP.lseries=seriesBump(APP.lseries,LG);LG.series=APP.lseries;try{APP.lfame=fameBump(APP.lfame,LG);}catch(e){}LG.fame=APP.lfame;LG.seriesDone=1;}}
    else if((type==="w"||type==="startDict")&&LG.auto&&LG.w!==prevW){sayWord(LG.w,LG.ws[LG.w]);D.left=D.pace*1000;}
    else if(type==="startDict"||type==="w")sfx("word");
    else{const m={pick:"pick",reveal:"reveal",ok:"ok",no:"no",finishDict:"done",begin:"start"}[type];if(m)sfx(m);}
    if(["ok","no","skip","finishDict","timeout"].includes(type)&&LG.phase==="ask")setTimeout(()=>sfx("turn"),650);
    if(LG.phase==="end"&&(type==="ok"||type==="no"))setTimeout(()=>sfx("done"),500);
    if(type==="pause")toast(LG.paused?"Пауза":"Продолжаем");
    renderLocal();renderTools();return;
  }
  if(APP.view==="online"){
    if(isAuth()&&HOST.G){
      if(isPhone(HOST.G)){applyPhone(HOST.G,type,arg,-1);publishHost();onState();return;}
      if(isSpy(HOST.G)){applySpy(HOST.G,type,arg,["sreveal","fskip"].includes(type)?-1:myIdx(HOST.G));publishHost();onState();return;}
      if(isCroc(HOST.G)){const mi=myIdx(HOST.G);applyCroc(HOST.G,type,arg,type==="cguess"?mi:(mi>=0&&mi===HOST.G.cr.d?mi:-1));publishHost();onState();return;}
      let t2=type,a2=type==="next"?"draw":arg;const mi=myIdx(HOST.G);
      if(type==="dans")a2={i:mi,t:arg};else if(type==="dacc"){t2="dmark";a2={i:+arg,ok:true};}else if(type==="foul")a2={by:mi,to:foulTarget(HOST.G)};else if(type==="gavote")a2={i:mi,v:+arg};
      applyAct(HOST.G,t2,a2);
      if(type==="startDict"||type==="w"||type==="next")D.left=D.pace*1000;
      publishHost();onState();
    }else if(!isAuth())sendAct(type,arg);
  }
}

function achTrack(g,L,local){

  const key=(g.gid||"loc")+"|"+g.players.map(p=>p.name).join(",");if(ACH.key!==key)achReset(key);

      if(up.filter(Boolean).length===1){const i=up.indexOf(true);ACH.solo[i]=(ACH.solo[i]||0)+1;if(ACH.solo[i]>=3)un(i,"lonewolf");}
      if(g.hist&&0){} }}

    if(g.phase==="end"&&!sw){const okN=g.asked.filter(x=>x===1).length,all=g.asked.filter(x=>x>0).length;if(all>=5&&okN===all)un(gDrawer(g),"elephant");}
  }
  if(g.phase==="end"&&L.phase==="ask"&&!isSwap(g)&&!isDuel(g)&&!(g.last&&(!L.last||g.last.n!==L.last.n))){const okN=g.asked.filter(x=>x===1).length,all=g.asked.filter(x=>x>0).length;if(all>=5&&okN===all)un(gDrawer(g),"elephant");}
  if(g.phase==="gauthor"&&g.ga&&g.ga.rev&&L.ga&&!L.ga.rev&&L.ga.i===g.ga.i){const o=g.ga.items[g.ga.i].o;for(const v in g.ga.votes)if(g.ga.votes[v]===o){ACH.eye[v]=(ACH.eye[v]||0)+1;if(ACH.eye[v]>=3)un(+v,"eye");}}

}

function seriesBump(series,g){
  if(!g||!g.players||!g.players.length)return series;const s=JSON.parse(JSON.stringify(series||{}));
  const top=Math.max(...g.scores);if(!(top>0))return s;
  g.players.forEach((p,i)=>{const k=p.pid||p.name;if(!s[k])s[k]={n:p.name,w:0};s[k].n=p.name;if(g.scores[i]===top)s[k].w++;});
  g.players.forEach(p=>{const k=p.pid||p.name;if(!s[k])s[k]={n:p.name,w:0};});return s;

  const P=g.players,n=P.length,doneN=(g.done||[]).filter(Boolean).length;
  if(g.phase==="pstep"){
    const kind=pKind(g.step),lim=phoneLimit(g),vi=(PH.view||0)%n;
    const chip=(p,i)=>auth?`<button class="chip ${g.done[i]?"on":""} ${i===vi?"sel":""}" type="button" data-act="viewP" data-arg="${i}">${avatar(p.name,i,"sm")}${esc(p.name)}${connDot(p.pid)}${g.done[i]?" ✓":""}</button>`:`<span class="chip ${g.done[i]?"on":""}">${avatar(p.name,i,"sm")}${esc(p.name)}${g.done[i]?" ✓":""}</span>`;
    const prog=`<div class="sec"><h3>Готовы: ${doneN} из ${n}</h3><div class="chips">${P.map(chip).join("")}</div>${auth?`<p class="note">Нажмите на игрока, чтобы посмотреть ${kind==="d"?"его рисунок":"рисунок, который он угадывает"}. Сейчас: ${esc(P[vi].name)}.</p>`:""}</div>`;
    const bar=lim?`<div class="tbar big"><i id="phbar"></i></div><p class="note" id="phsec"></p>`:"";
    const head=`<div class="sec"><div class="row" style="justify-content:space-between"><h3>Шаг ${g.step+1} из ${g.steps}</h3><span class="pill">${kind==="d"?"рисуем":"угадываем"}</span></div>`;
    if(auth||me<0){
      let peek="";if(auth){const c=pChain(g,vi,g.step),pr=pPrompt(g,c,g.step);peek=kind==="d"?`<p class="note">${esc(P[vi].name)} рисует: <b>${esc(pr.t||"…")}</b></p>`:"";}
      return head+`<p>${kind==="d"?"Каждый рисует своё слово или догадку соседа.":"Каждый угадывает рисунок соседа."}</p>${peek}${bar}</div>${prog}${auth?`<div class="sec"><button class="btn line" type="button" data-act="pAdv">${doneN<n?"Завершить шаг досрочно":"Дальше"}</button><p class="note">Шаг закончится сам, когда все нажмут «Готово»${lim?" или выйдет время":""}.</p></div>`:""}`;
    }
    const c=pChain(g,me,g.step),pr=pPrompt(g,c,g.step);
    if(g.done[me])return head+`<h2>Готово!</h2><p class="muted">Ждём остальных.</p>${bar}<button class="linkbtn" type="button" data-act="pUnready">Изменить</button></div>${prog}`;
    if(kind==="d")return head+`<p class="note">${g.step===0?"Ваше слово":"Сосед решил, что на рисунке это. Нарисуйте"}</p><div class="reveal">${pr.t?esc(pr.t):"…"}</div>${pr.t?"":`<p class="note">Догадки не было: нарисуйте что угодно.</p>`}<p class="note">Без букв и цифр. Следующий игрок увидит только рисунок.</p>${bar}</div>
      <div class="sec"><h3 class="h3art"><span class="art">${ART.pencils}</span>Кисть</h3>${toolsHTML()}</div><div class="sec"><button class="btn big" type="button" data-act="pDone">Готово</button></div>${prog}`;
    const empty=!phoneStrokes(g).length;
    return head+`<p>Что нарисовано на поле? Напишите слово или короткую фразу.</p>${empty?`<p class="note">Рисунок пустой или ещё не дошёл. Подождите пару секунд или напишите любую догадку.</p>`:""}
      <form data-submit="pDone" class="stack" style="gap:10px"><input class="input" id="pguess" maxlength="40" autocomplete="off" placeholder="Ваша догадка" value="${esc(PH.draft)}" aria-label="Ваша догадка"><button class="btn big" type="submit">Готово</button></form>${bar}</div>${prog}`;
  }
  if(g.phase==="preveal"){
    const c=g.rv.c,ch=g.chains[c],t=phoneTarget(g),shown=t&&!t.word?t.s:-1;
    let items=`<div class="pc"><span class="note">Слово</span><b>${esc(ch.w)}</b></div>`;
    for(let st=0;st<g.rv.e;st++){const en=ch.e[st]||{},by=pBy(g,c,st),nm=esc(P[by].name);
      items+=pKind(st)==="d"?`<button type="button" class="pc pcd ${shown===st?"on":""}" data-act="pShow" data-arg="${st}">${avatar(P[by].name,by,"sm")}<span class="grow">${nm} рисует</span><span class="note">${shown===st?"на поле":"показать"}</span></button>`
        :`<div class="pc">${avatar(P[by].name,by,"sm")}<span>${nm}:</span><b class="grow">${en.t?"«"+esc(en.t)+"»":"не ответил(а)"}</b>${en.ok?'<span class="okt">+1</span>':""}</div>`;}
    const fin=g.rv.e>=g.steps;let verdict="";
    if(fin){let lt="";for(let st=g.steps-1;st>=0;st--)if(pKind(st)==="g"&&ch.e[st]){lt=ch.e[st].t||"";break;}
      verdict=lt?(normW(lt)===normW(ch.w)?"Дошло без искажений!":`Было «${esc(ch.w)}», стало «${esc(lt)}».`):"";}
    const lastChain=c>=g.chains.length-1;
    return `<div class="sec"><div class="row" style="justify-content:space-between"><h3>Цепочка ${c+1} из ${g.chains.length}</h3><span class="pill">начал(а) ${esc(P[pBy(g,c,0)].name)}</span></div>
      <div class="pchain">${items}</div>${verdict?`<p class="pverdict">${verdict}</p>`:""}</div>
      ${auth?`<div class="sec"><div class="row"><button class="btn soft" type="button" data-act="pPrev" ${c===0&&g.rv.e===0?"disabled":""} aria-label="Назад">←</button><button class="btn big grow" type="button" data-act="pNext">${!fin?"Показать дальше":(lastChain?"Итоги игры":"Следующая цепочка")}</button></div></div>`:`<p class="note">Ведущий открывает цепочку шаг за шагом. Нажимайте на рисунки, чтобы посмотреть их ещё раз.</p>`}
      <div class="sec" style="margin-top:auto"><p class="note">Очки: угадал точно, и +1 получают угадавший и рисовавший.</p></div>`;
  }
  return "";
}

                <ol class="steps">${g.auto?`<li><span>Озвучка на устройстве рисующего произносит номер клетки и слово.</span></li><li><span>Рисующий рисует у себя, остальные видят рисунок вживую и сами слова.</span></li><li><span>В свой ход нажмите клетку. Рисующий отвечает голосом.</span></li><li><span>Спрашивающий или рисующий открывает слово и засчитывает ответ.</span></li>`:
        `<li><span>Ведущий диктует номер клетки и слово. Темп задаёт он.</span></li><li><span>Рисующий рисует у себя, остальные видят рисунок вживую.</span></li><li><span>В свой ход нажмите клетку. Рисующий отвечает голосом.</span></li><li><span>Ведущий открывает слово и засчитывает ответ.</span></li>`}</ol>
        ${g.auto?`<label class="check"><input type="checkbox" data-act="speakAll" ${PREF.speakAll?"checked":""}> Озвучивать слова и на моём устройстве</label>${voiceHTML()}`:""}
        <p class="note">${g.circles} ${plural(g.circles,"круг","круга","кругов")} вопросов, кругов рисования: ${g.times}, начинаем с уровня «${LEVEL[g.lvl0]||"Лёгкие"}».</p>`}`}
        <button class="linkbtn" type="button" data-act="leave">Выйти из лобби</button>
      </div></div>`;
    return;
  }
  if(g.phase==="final"){BC=null;app.innerHTML=finalHTML(g,{admin:auth,online:true});requestAnimationFrame(drawGalThumbs);return;}
  if(isPhone(g)){renderPhone(g);return;}
  if(isCroc(g)){renderCroc(g);return;}
  if(isSpy(g)){renderSpy(g);return;}
  if(g.phase==="gauthor"){renderGA(g);return;}
  const me=myIdx(g),sw=isSwap(g),drawer=sw||isFast(g)?amAuthor(g):amDrawer(g),di=gDrawer(g),dn=esc(g.players[di].name);
  if(!$("#side")||!BC||BC.kind!=="online"){
    app.innerHTML=playLayout();
    mountBoard({kind:"online",
      strokes:()=>showMine(curG())?NET.my:NET.mirror,
      mode:()=>{const G=curG();if(!G||!G.players||G.paused)return"view";if(G.phase==="draw"&&amAuthor(G))return"draw";
        if(G.phase!=="ask")return"view";const me=myIdx(G),P=G.pend;
        if(isDuel(G))return !P&&((isAuth()&&!G.selfPlay)||(G.selfPlay&&me===gPicker(G)))?"pick":"view";
        if(isShuf(G))return P&&!P.rev&&me>=0&&me===gAnswerer(G)?"pick":"view";
        if(!(P&&P.rev)&&((isAuth()&&!G.auto&&!G.selfPlay)||me===gAsker(G)))return"pick";return"view";},
      view:()=>{const G=curG();if(!G||!G.players)return{};const iD=amAuthor(G),host=isAuth()&&!G.auto&&!G.selfPlay,sh=isShuf(G)&&G.phase==="ask";
        return{n:G.n||25,asked:G.asked,words:G.ws,upto:G.w,show:G.phase==="end"?"all":((host||!iD)&&G.phase==="draw"?"upto":"asked"),
          reveal:!sh&&G.pend&&G.pend.rev?G.pend.cell:-1,active:G.phase==="draw"?G.w:-1,ring:!sh&&G.phase==="ask"&&G.pend?G.pend.cell:(G.chain&&G.phase==="draw"&&G.w>0?G.w-1:-1),
          perm:sh?G.perm:null,hl:sh&&G.pend&&G.pend.hh?G.pend.hh:null,miss:sh&&G.pend?G.pend.miss:null,
          authors:isSwap(G)&&G.phase!=="draw"?G.ws.map((_,k)=>{const i=gCellAuthor(G,k);return{i,n:G.players[i].name};}):null};},
      onPick:k=>{const G=curG();if(!G)return;if(isShuf(G)){if(G.perm&&!G.asked[G.perm[k]])doAct("guessCell",k);return;}if(G.asked[k])return;doAct("pick",k);},
      onStroke:()=>pubBoard()});
  }
  if(isDuel(g)){setSide((g.phase==="draw"?graceHTML(g)+flagNotes(g,!amAuthor(g)):"")+duelSide(g,auth,me)+rxBarHTML()+hostToolsHTML());repaint();syncPause(g);return;}
  let html="";
  const vi=(PH.view||0)%g.players.length;
  const whoBox=sw?`<div class="sec"><h3>Чужие рисунки · рисуют все</h3>${auth?`<p class="note">Смотреть поле игрока:</p><div class="chips">${g.players.map((p,i)=>`<button class="chip ${i===vi?"on":""}" type="button" data-act="viewP" data-arg="${i}">${avatar(p.name,i,"sm")}${esc(p.name)}${peekMark(p.pid,g)}</button>`).join("")}</div>`:`<p class="note">Все рисуют одни и те же слова. ${g.swapMix?"Потом ваши рисунки разойдутся по полям разных игроков.":g.swapShuf===0?"Потом по вашему полю будет отвечать сосед.":"Потом клетки перемешаются, и сосед будет искать слова на вашем поле."}</p>`}</div>`
    :`<div class="sec"><div class="who">${avatar(g.players[di].name,di,"lg")}<div><span class="note">Рисует</span><br><b>${dn}</b>${peekMark(g.players[di].pid,g)}${drawer?' <span class="you">вы</span>':""}</div></div></div>`;
  if(g.phase==="draw"){
    if(g.auto){
      html=`${whoBox}${autoHTML(g,{canStart:drawer||auth,canPause:drawer||auth,hear:hearWords(g),timer:auth,controls:auth,isDrawer:drawer,showWord:!drawer})}
        ${drawer?`<div class="sec"><h3 class="h3art"><span class="art">${ART.pencils}</span>Кисть</h3>${toolsHTML()}</div>`:`<div class="sec"><p class="note">Присматривайтесь, какие рисунки вышли неразборчивыми: потом спросите именно их.</p></div><div class="sec" style="margin-top:auto">${scoreHTML(g)}</div>`}`;
    }else if(g.selfPlay){
      const bar=auth?`<div class="tbar big"><i id="dbar"></i></div><p class="note" id="dsec"></p>`:`<div class="tbar big"><i id="pbar"></i></div><p class="note" id="psec"></p>`;
      const ctl=g.w<0?`<button class="btn big" type="button" data-act="dStart">Старт</button><p class="note">Начать может любой игрок, когда рисующий готов.</p>`
        :`<div class="row"><button class="btn line grow" type="button" data-act="pause">${g.paused?"Продолжить":"Пауза"}</button><button class="btn soft grow" type="button" data-act="g" data-arg="finishDict">К вопросам</button></div>`;
      html=drawer?`<div class="sec"><h3>Игра без ведущего</h3>
          ${isFast(g)?`<p class="note"><b>Быстрый режим:</b> все рисуют одновременно, у каждого свои слова, но несколько слов у вас совпадут.</p>`:""}
          ${g.w<0?`<p style="font-size:16px">Номер и слово появятся прямо на поле, рядом с клеткой. Темп: ${paceFor(g,0)} с на слово${g.accel?", с ускорением":""}.</p>`:`<div class="bignum" id="bignum">№ ${g.w+1}<small> / ${g.n||25}</small></div><p>Слово показано на поле рядом с клеткой <b>${g.w+1}</b>.</p>${bar}`}
          ${ctl}<p class="note">Можно рисовать в любой клетке и дорисовывать. Без букв и цифр.</p></div>
          <div class="sec"><h3 class="h3art"><span class="art">${ART.pencils}</span>Кисть</h3>${toolsHTML()}</div>`
        :`${whoBox}<div class="sec"><h3>Слово для рисующего</h3>${g.w<0?`<p>Ждём старта.</p>`:`<div class="dictrow"><div class="bignum" id="bignum">${g.w+1}</div><div class="dword ${wcls(g.ws[g.w])}">${esc(g.ws[g.w])}</div></div>${bar}`}
          ${ctl}<p class="note">Слова видны вам, а рисующему только на поле в момент диктовки. Присматривайтесь к неразборчивым рисункам.</p></div>
          <div class="sec" style="margin-top:auto">${scoreHTML(g)}</div>`;
    }else if(auth){
      html=`${whoBox}<div class="sec"><p class="note">${sw?"Вы видите поле выбранного игрока вживую. Слова видны только вам.":"Вы видите рисунок вживую. Слова на поле видны вам и спрашивающим, но не рисующему."}</p></div><div class="sec">${dictHTML(g.ws,g.w,true)}</div>`;
    }else if(drawer){
      html=`<div class="sec"><h3>Ведущий диктует</h3>
        ${g.w<0?`<p style="font-size:17px">Приготовьтесь. Ведущий скоро начнёт. Каждое новое слово сопровождается сигналом.</p>`:`<div class="bignum" id="bignum">№ ${g.w+1}<small> / ${g.n||25}</small></div><p>Рисуйте в клетке <b>${g.w+1}</b>, она подсвечена на поле. Слово ведущий говорит голосом.</p><div class="tbar big"><i id="pbar"></i></div><p class="note" id="psec"></p>`}
        <p class="note">${sw?(g.swapMix?"Рисуйте понятно: ваши рисунки увидят разные игроки, и за каждый их верный ответ очко получите и вы. ":g.swapShuf===0?"Рисуйте понятно: по вашему полю будет отвечать сосед, и за его верный ответ очко получите и вы. ":"Рисуйте понятно: потом клетки перемешаются, и сосед будет искать слова по вашим рисункам. Нашёл: очко и вам. "):""}Можно рисовать в любой клетке и дорисовывать. Без букв и цифр.</p></div>
        <div class="sec"><h3 class="h3art"><span class="art">${ART.pencils}</span>Кисть</h3>${toolsHTML()}</div>`;
    }else{
      html=`${whoBox}<div class="sec"><h3>Ведущий диктует</h3>${g.w<0?`<p>Скоро начнём.</p>`:`<div class="dictrow"><div class="bignum" id="bignum">${g.w+1}</div><div class="dword ${wcls(g.ws[g.w])}">${esc(g.ws[g.w])}</div></div><div class="tbar big"><i id="pbar"></i></div><p class="note" id="psec"></p>`}
        <p class="note">Слова видны вам, но не рисующему. Присматривайтесь, какие рисунки вышли неразборчивыми: потом спросите именно их.</p></div>
        <div class="sec" style="margin-top:auto">${scoreHTML(g)}</div>`;
    }
  }else if(g.phase==="ask"){
    const myTurn=me>=0&&me===gAsker(g);
    const judge=g.selfPlay?(me>=0&&(me===gAsker(g)||(auth&&me!==gDrawer(g)))):g.auto?(myTurn||drawer):auth;
    const adminHost=auth;
    html=`${askerBlock(g)}<div class="sec">${askBody(g,{judge,admin:adminHost,myTurn,canPick:auth&&!g.auto&&!g.selfPlay,amDrawer:sw?(me>=0&&me===gAnswerer(g)):drawer,canReveal:auth||me>=0,jokerMine:me>=0&&me===gAnswerer(g)})}${adminHost&&HOST.G.hist.length?`<button class="linkbtn" type="button" data-act="g" data-arg="undo">Отменить последнее решение</button>`:""}</div><div class="sec" style="margin-top:auto">${scoreHTML(g)}</div>`;
  }else if(g.phase==="end"){
    html=endBlock(g,{admin:auth||(g.selfPlay&&me>=0),hist:auth&&HOST.G.hist.length>0});
  }
  if(g.phase==="draw")html=graceHTML(g)+flagNotes(g,!amAuthor(g))+html;
  html=(g.foul?foulHTML(g,auth,me):"")+html+(g.foul?"":foulHTML(g,auth,me))+rxBarHTML()+hostToolsHTML();
  setSide(html);repaint();syncPause(g);
}

/* Клавиатура */
document.addEventListener("keydown",e=>{
  const tag=e.target.tagName;if(tag==="INPUT"||tag==="TEXTAREA")return;
  const w=dictW();
  if(w!==null&&w>=0&&!autoNow()){if(e.key==="ArrowRight"){e.preventDefault();dictMove(1);return;}if(e.key==="ArrowLeft"){e.preventDefault();dictMove(-1);return;}}
  if(BC&&BC.mode()==="draw"){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undoStroke();return;}
    if(e.key.toLowerCase()==="e"||e.key.toLowerCase()==="у"){ACT.eraser();return;}
  }
  if((e.key==="p"||e.key==="P"||e.key==="з"||e.key==="З")&&canPauseNow()){e.preventDefault();ACT.pause();return;}
  if(e.key==="Escape"&&TOUR.on){endTour();return;}
  if(e.key==="Escape"&&$("#lb")){galClose();return;}
  if(e.key==="Enter"){
    const G=APP.view==="local"?LG:(APP.view==="online"?curG():null);
    if(G&&G.phase==="ask"&&G.pend&&!G.pend.rev){
      const me=myIdx(G),can=APP.view==="local"||isAuth()||me>=0;
      if(can){e.preventDefault();doAct("reveal");}
    }
  }
});
window.addEventListener("resize",()=>{if($("#demo"))drawDemo();});
window.addEventListener("hashchange",()=>{if(hashJoin()){render();tryAutoJoin();return;}if(location.hash==="#host")APP.view="hostcode";else if(APP.view==="hostcode")APP.view="home";render();});
window.addEventListener("beforeunload",()=>{if(isAuth()&&HOST.code)store.set("hostSave",{code:HOST.code,G:HOST.G,lobby:HOST.lobby,at:Date.now(),jt:NET.jt});});

/* Запуск */
applyTheme();hashJoin();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{TK=null;repaint();});
requestAnimationFrame(loop);
initNet();
</script>
</body>
</html>
